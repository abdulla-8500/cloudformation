AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation Template to launch an EC2 instance, download an HTML template, and serve it via Apache

Parameters: 
  NameOfService:
    Description: "The name of the service this stack is to be used for."
    Type: String  
  InstanceTypeParameter: 
    Description: Enter t3.micro, t3.small, t3.medium, m1.small, or m1.large. Default is t3.micro.
    Type: String
    Default: t2.micro
    AllowedValues: 
      - t2.micro
      - t2.small
      - t2.medium
      - m1.small
      - m1.large
  KeyName:
    Description: Name of EC2 login key
    Type: AWS::EC2::KeyPair::KeyName

Mappings: 
  AmiRegionMap: 
    ap-south-1: 
      AMI: "ami-04f8d7ed2f1a54b14"
    ap-southeast-1: 
      AMI: "ami-001440bcc4ddffcf1"
    ap-southeast-2: 
      AMI: "ami-023eb5c021738c6d0"

Resources:
  VprofileSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ssh & http from MyIP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0  

  WebServer:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init: 
        configSets:
          default:
            - setup
            - configure
        setup:
          packages: 
            yum:
              httpd: []
              php: []
              wget: []
              unzip: []
              git: []
        configure:
          commands:
            01_download_template:
              command: "wget https://www.tooplate.com/zip-templates/2119_gymso_fitness.zip -O /tmp/2119_gymso_fitness.zip"
            02_extract_template:
              command: "unzip /tmp/2119_gymso_fitness.zip -d /tmp/ && cp -r /tmp/2119_gymso_fitness/* /var/www/html/"
          files:
            /var/www/html/hello.html:
              content: !Sub |
                <!DOCTYPE html>
                <html>
                <body>
                <h1>Welcome to CloudFormation.</h1>
                <p>This site is deployed by CloudFormation.</p>
                </body>
                </html>
          services: 
            sysvinit:
              httpd:
                enabled: true
                ensureRunning: true
    Properties:
      InstanceType: !Ref InstanceTypeParameter
      KeyName: !Ref KeyName
      ImageId: !FindInMap
        - AmiRegionMap
        - !Ref AWS::Region
        - AMI
      Tags:
        - Key: "Name"
          Value: !Ref NameOfService
      SecurityGroups:
        - !Ref VprofileSG
      UserData: 
        Fn::Base64: 
          !Sub |
            #!/bin/bash -xe
            # Install AWS CFN Bootstrap tools
            yum install -y aws-cfn-bootstrap
            # Run cfn-init to setup the instance
            /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}
            # Signal completion
            /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}

Outputs:
  InstancePublicDNS:
    Description: Public DNS name of the newly created EC2 instance
    Value: !GetAtt WebServer.PublicDnsName
